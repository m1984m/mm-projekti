<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MM projekti, tehnično svetovanje, inženiring in spletne rešitve">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E4634" stroke-width="0.6" opacity="0.10"/>
    </pattern>
    <pattern id="gridFine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#1E4634" stroke-width="0.4" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F4F1E9"/>
  <rect width="1200" height="630" fill="url(#gridFine)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- plate frame + registration ticks -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1E4634" stroke-width="1.5" opacity="0.35"/>
  <g stroke="#1E4634" stroke-width="1.5" opacity="0.55" fill="none" stroke-linecap="round">
    <path d="M40 70V40h30M1130 40h30v30M1160 560v30h-30M70 590H40v-30"/>
  </g>

  <!-- monogram mark -->
  <g transform="translate(96,96)">
    <rect width="84" height="84" rx="17" fill="#1E4634"/>
    <path d="M20 62V25l22 21 22-21v37" fill="none" stroke="#F4F1E9" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="46" r="3.8" fill="#C2703B"/>
  </g>
  <text x="200" y="130" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="22" letter-spacing="4" fill="#1E4634">MM PROJEKTI, S.P.</text>
  <text x="200" y="160" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="15" letter-spacing="2" fill="#5A6B5F">MATEJ MOHARI&#268; &#183; MARIBOR &#183; SI</text>

  <!-- headline -->
  <text x="96" y="330" font-family="Georgia,'Times New Roman',serif" font-size="76" fill="#15201A">Tehnično svetovanje,</text>
  <text x="96" y="408" font-family="Georgia,'Times New Roman',serif" font-size="76" fill="#15201A">inženiring &amp; <tspan font-style="italic" fill="#2D5A3D">splet</tspan>.</text>

  <text x="98" y="470" font-family="'Hanken Grotesk','DejaVu Sans',sans-serif" font-size="25" fill="#5A6B5F">Strokovne podlage, dokumentacija in spletne rešitve po meri.</text>

  <!-- right blueprint illustration: truss + browser wireframe -->
  <g transform="translate(820,150)" stroke="#1E4634" fill="none" stroke-width="2" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- browser frame -->
    <rect x="0" y="120" width="270" height="180" rx="10"/>
    <line x1="0" y1="152" x2="270" y2="152"/>
    <circle cx="18" cy="136" r="4" fill="#C2703B" stroke="none"/>
    <circle cx="34" cy="136" r="4"/>
    <circle cx="50" cy="136" r="4"/>
    <line x1="24" y1="186" x2="150" y2="186"/>
    <line x1="24" y1="210" x2="200" y2="210"/>
    <line x1="24" y1="234" x2="120" y2="234"/>
    <rect x="180" y="226" width="66" height="46" rx="6"/>
    <!-- truss above -->
    <path d="M10 110 L80 20 L150 110 L220 20 L290 110 Z"/>
    <line x1="80" y1="20" x2="80" y2="110"/>
    <line x1="220" y1="20" x2="220" y2="110"/>
    <line x1="45" y1="65" x2="150" y2="110"/>
    <line x1="255" y1="65" x2="150" y2="110"/>
  </g>
  <g transform="translate(820,150)">
    <circle cx="80" cy="20" r="5" fill="#C2703B"/>
    <circle cx="220" cy="20" r="5" fill="#C2703B"/>
    <circle cx="150" cy="110" r="5" fill="#1E4634"/>
  </g>

  <!-- footer mono line -->
  <line x1="96" y1="520" x2="1104" y2="520" stroke="#1E4634" stroke-width="1" opacity="0.25"/>
  <text x="96" y="556" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="16" letter-spacing="1.5" fill="#5A6B5F">46.5400&#176; N &#160; 15.6322&#176; E</text>
  <text x="1104" y="556" text-anchor="end" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="16" letter-spacing="1.5" fill="#5A6B5F">+386 41 891 030</text>
</svg>
