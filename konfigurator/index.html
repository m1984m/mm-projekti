<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konfigurator pametnega doma | MM projekti</title>
<meta name="description" content="Sestavite pametni dom za svoje stanovanje ali hišo: izberite tloris, naprave po prostorih in takoj vidite ceno z DDV.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --pine:#1E4634; --pine-2:#2C5A45; --ink:#1C2420; --soft:#5F6B64; --rule:#DCE3DE; --tint:#EEF3EF;
    --clay:#B4612E; --paper:#FFFFFF; --bg:#F3F5F3;
    --sans:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --serif:'Source Serif 4', Georgia, serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font:15px/1.45 var(--sans); color:var(--ink); background:var(--bg); }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--clay); outline-offset:2px; }

  .app { display:grid; grid-template-columns:1fr 400px; grid-template-rows:minmax(0, 1fr); height:100vh; }
  #pogled { position:relative; min-width:0; }
  #pogled canvas { display:block; width:100%; height:100%; }
  .namig { position:absolute; left:16px; bottom:16px; font-size:13px; color:var(--soft); background:rgba(255,255,255,.8); padding:4px 8px; border-radius:8px; }
  .znak { position:absolute; left:16px; top:16px; display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--pine); font-weight:500; background:rgba(255,255,255,.85); padding:6px 12px 6px 6px; border-radius:12px; }
  .znak svg { width:30px; height:30px; }
  .etaze { position:absolute; top:16px; left:50%; transform:translateX(-50%); display:flex; gap:4px; background:rgba(255,255,255,.92); padding:4px; border-radius:12px; box-shadow:0 1px 3px rgba(20,32,26,.08); }
  .etaze[hidden] { display:none; }
  .etaze button { border:0; background:none; padding:6px 12px; border-radius:8px; color:var(--soft); font-weight:500; font-size:13.5px; white-space:nowrap; }
  .etaze button[aria-pressed="true"] { background:var(--pine); color:#fff; }

  .panel { background:var(--paper); border-left:1px solid var(--rule); display:flex; flex-direction:column; min-height:0; }
  .panel header { padding:20px 20px 0; }
  .panel h1 { font-size:21px; line-height:1.15; margin:0 0 4px; color:var(--pine); font-weight:500; }
  .panel header p { margin:0 0 16px; color:var(--soft); font-size:13.5px; }
  .glava { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .glava h1 { min-width:0; }
  .jeziki { display:flex; gap:2px; flex:none; }
  .jeziki button { border:0; background:none; padding:4px; border-radius:6px; color:var(--soft); font-family:var(--sans); font-size:11.5px; font-weight:500; letter-spacing:.03em; line-height:1.2; }
  .jeziki button:hover { color:var(--pine); background:var(--tint); }
  .jeziki button[aria-pressed="true"] { background:var(--pine); color:#fff; }
  nav.zavihki { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--rule); padding:0 12px; }
  nav.zavihki button { border:0; background:none; padding:12px 4px; color:var(--soft); font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; }
  nav.zavihki button[aria-selected="true"] { color:var(--pine); border-bottom-color:var(--pine); }
  .vsebina { flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 20px 24px; scrollbar-width:thin; scrollbar-color:var(--rule) transparent; }
  .vsebina h2 { font-size:15px; margin:20px 0 8px; color:var(--pine); font-weight:500; }
  .vsebina h2:first-child { margin-top:0; }
  .opis { color:var(--soft); font-size:13.5px; margin:0 0 12px; }

  .predloge { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
  .predloge button { text-align:left; border:1px solid var(--rule); background:var(--paper); border-radius:12px; padding:12px; }
  .predloge button b { display:block; font-weight:500; overflow-wrap:anywhere; hyphens:auto; }
  .predloge button span { display:block; font-size:12.5px; color:var(--soft); font-variant-numeric:tabular-nums; }
  .predloge button[aria-pressed="true"] { border-color:var(--pine); background:var(--tint); }

  .soba { border-top:1px solid var(--rule); padding:12px 0; }
  .soba.izbrana { background:linear-gradient(90deg, var(--tint), transparent); margin:0 -20px; padding:12px 20px; }
  .soba .vrsta1 { display:grid; grid-template-columns:1fr 128px 30px; gap:8px; align-items:center; }
  .soba input[type=text], .soba select, .mere input { border:1px solid var(--rule); border-radius:8px; padding:6px 8px; background:#fff; width:100%; }
  .mere { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
  .mere label { font-size:11.5px; color:var(--soft); }
  .mere input { padding:4px 6px; }
  .brisi { border:0; background:none; color:var(--soft); font-size:18px; line-height:1; padding:4px; border-radius:6px; }
  .brisi:hover { color:var(--clay); background:#F7EDE6; }
  .etazni { display:grid; gap:8px; }
  .etazna { display:flex; justify-content:space-between; align-items:center; border:1px solid var(--rule); border-radius:8px; padding:8px 12px; font-size:13.5px; color:var(--soft); }
  .etazna b { color:var(--ink); font-weight:500; margin-right:8px; }
  .brisi-etazo { border:0; background:none; color:var(--clay); font-weight:500; font-size:13px; padding:2px 4px; }
  .etaza-naslov { font-size:13px; color:var(--soft); font-weight:500; margin:16px 0 4px; }
  .etaza-izbira { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--soft); }
  .etaza-izbira select { border:1px solid var(--rule); border-radius:8px; padding:4px 6px; background:#fff; }
  .dodaj { margin-top:8px; width:100%; border:1px dashed var(--pine-2); color:var(--pine); background:none; border-radius:8px; padding:8px; font-weight:500; }
  .povrsina { font-size:12.5px; color:var(--soft); margin-top:10px; }
  .opozorilo { color:var(--clay); font-size:12.5px; margin-top:4px; }

  .skupina { border-top:1px solid var(--rule); padding:12px 0 4px; }
  .skupina h3 { font-size:14px; margin:0 0 8px; font-weight:500; display:flex; justify-content:space-between; }
  .skupina h3 span { font-weight:400; color:var(--soft); font-size:12.5px; }
  .naprava { display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; padding:4px 0; }
  .naprava svg { width:20px; height:20px; }
  .naprava .ime { font-size:13.5px; }
  .naprava .ime small { display:block; color:var(--soft); font-size:11.5px; }
  .stevec { display:flex; align-items:center; border:1px solid var(--rule); border-radius:8px; overflow:hidden; }
  .stevec button { border:0; background:#fff; width:30px; height:28px; color:var(--pine); font-size:17px; }
  .stevec button:hover { background:var(--tint); }
  .stevec output { min-width:26px; text-align:center; font-variant-numeric:tabular-nums; font-weight:500; }

  table.cene { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.cene td { padding:6px 0; border-bottom:1px solid var(--rule); vertical-align:top; }
  table.cene td.n { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; padding-left:8px; }
  table.cene tr.vsota td { font-weight:500; color:var(--pine); border-bottom:none; padding-top:8px; }
  table.cene small { color:var(--soft); }

  .noga { border-top:1px solid var(--rule); padding:16px 20px; background:var(--paper); }
  .noga .zneski { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .noga .zneski b { font-size:26px; color:var(--pine); font-weight:500; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .noga .zneski span { color:var(--soft); font-size:13px; text-align:right; }
  .gumbi { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .gumbi button { border-radius:8px; padding:12px; font-weight:500; border:1px solid var(--pine); }
  .gumbi .glavni { background:var(--pine); color:#fff; }
  .gumbi .drugi { background:#fff; color:var(--pine); }
  .sporocilo { font-size:12.5px; color:var(--pine-2); min-height:18px; margin-top:6px; }

  .kratko { display:none; }
  @media (max-width: 860px) {
    .etaze { top:auto; bottom:8px; }
    .etaze button { padding:4px 8px; font-size:12.5px; }
    .app { grid-template-columns:1fr; grid-template-rows:minmax(190px, 34svh) minmax(0, 1fr); height:100dvh; }
    .panel { border-left:0; border-top:1px solid var(--rule); min-height:0; }
    .panel header { padding:10px 16px 0; }
    .panel h1 { font-size:17px; margin:0 0 2px; }
    .panel header p { display:none; }
    .glava { gap:6px; }
    .jeziki button { padding:4px; font-size:11px; }
    nav.zavihki button { padding:8px 4px 9px; font-size:14px; }
    .vsebina { padding:12px 16px 16px; }
    .namig { display:none; }
    .znak { top:8px; left:8px; padding:4px 10px 4px 4px; font-size:14px; }
    .znak svg { width:24px; height:24px; }
    .noga { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:center; padding:8px 16px calc(8px + env(safe-area-inset-bottom)); }
    .noga .zneski { display:block; margin:0; }
    .noga .zneski b { display:block; font-size:21px; line-height:1.1; letter-spacing:0; }
    .noga .zneski span { display:block; text-align:left; font-size:11.5px; line-height:1.3; }
    .gumbi { gap:6px; }
    .gumbi button { padding:8px 4px; font-size:13px; line-height:1.2; white-space:nowrap; }
    .dolgo { display:none; }
    .kratko { display:inline; }
    .sporocilo { grid-column:1 / -1; min-height:0; margin-top:0; }
    .sporocilo:empty { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }

  /* ---------- ponudba za tisk ---------- */
  #ponudba { display:none; }
  @media print {
    @page { size:A4; margin:14mm 15mm 15mm; }
    html, body { height:auto; background:#fff; }
    .app { display:none !important; }
    #ponudba { display:block; font:9.6pt/1.5 var(--serif); color:var(--ink); }
    #ponudba * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  #ponudba .gl { display:flex; justify-content:space-between; align-items:center; font-family:var(--sans); font-size:8.5pt; color:var(--soft); border-bottom:1px solid var(--rule); padding-bottom:3mm; }
  #ponudba .gl .zn { display:flex; gap:2.4mm; align-items:center; color:var(--pine); font-weight:600; font-size:11pt; }
  #ponudba .gl svg { width:8mm; height:8mm; }
  #ponudba h1 { font-family:var(--sans); font-size:24pt; color:var(--pine); margin:7mm 0 1mm; font-weight:600; letter-spacing:-.02em; line-height:1.05; }
  #ponudba .podnaslov { color:var(--soft); margin:0 0 5mm; }
  #ponudba .meta { display:grid; grid-template-columns:repeat(4,1fr); gap:4mm; font-family:var(--sans); font-size:8.3pt; margin-bottom:5mm; }
  #ponudba .meta span { display:block; color:var(--soft); }
  #ponudba .meta b { font-weight:600; font-size:9.5pt; }
  #ponudba .meta .crta { border-bottom:1px solid var(--ink); height:5mm; }
  #ponudba img.slika { display:block; max-width:100%; max-height:92mm; margin:0 auto; }
  #ponudba h2 { font-family:var(--sans); font-size:12.5pt; color:var(--pine); margin:5mm 0 2mm; font-weight:600; page-break-after:avoid; break-after:avoid; }
  #ponudba table { width:100%; border-collapse:collapse; font-family:var(--sans); font-size:8.8pt; page-break-inside:auto; }
  #ponudba th { text-align:left; font-weight:600; color:var(--pine); border-bottom:1.4px solid var(--pine); padding:1.3mm 0; }
  #ponudba td { padding:.8mm 0; border-bottom:1px solid var(--rule); }
  #ponudba td.n, #ponudba th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:3mm; }
  #ponudba tr.vs td { font-weight:600; color:var(--pine); border-bottom:none; }
  #ponudba tr { page-break-inside:avoid; }
  #ponudba .skupaj { margin-top:4mm; display:grid; grid-template-columns:1fr auto; align-items:end; background:var(--pine); color:#fff; border-radius:2mm; padding:4.5mm 6mm; font-family:var(--sans); page-break-inside:avoid; }
  #ponudba .skupaj .v { font-size:8.8pt; line-height:1.75; opacity:.9; }
  #ponudba .skupaj .v span { display:inline-block; min-width:64mm; padding-right:3mm; }
  #ponudba .skupaj b { font-size:21pt; font-weight:600; }
  #ponudba .skupaj small { display:block; text-align:right; font-size:8pt; opacity:.8; }
  #ponudba ul { padding-left:4.5mm; margin:2mm 0; }
  #ponudba li { margin-bottom:.5mm; }
  #ponudba .pod { display:grid; grid-template-columns:1fr 1fr; gap:14mm; margin-top:8mm; font-family:var(--sans); font-size:8.5pt; color:var(--soft); page-break-inside:avoid; }
  #ponudba .pod div { border-top:1px solid var(--ink); padding-top:2mm; }
  #ponudba .pod b { display:block; color:var(--ink); }
  #ponudba .prelom { page-break-before:always; }
</style>

<div class="app">
  <main id="pogled" aria-label="3D prikaz doma" data-i18n-aria="pogled3d">

    ${st.sobe.slice().sort((a, b) => a.e - b.e).map((r, i, arr) => `${steviloEtaz() > 1 && (i === 0 || arr[i - 1].e !== r.e) ? `<tr><td colspan="2" style="font-weight:600;color:#1E4634;padding-top:2mm">${imeEtaze(r.e)}</td></tr>` : ''}<tr><td>${esc(imeSobe(r))} <span style="color:#5F6B64">${m2(r.w * r.d)} m²</span></td><td>${SOBNE.filter(k => r.n[k]).map(k => `${r.n[k]} × ${malo(imeNap(k))}`).join(', ') || '–'}</td></tr>`).join('')}
  </tbody></table>
  <h2>${t('razdelitev')}</h2>
  <table><thead><tr><th>${t('postavka')}</th><th class="n">${t('kolicina')}</th><th class="n">${t('cena')}</th><th class="n">${t('znesek')}</th></tr></thead><tbody>
    ${vrsticeOpreme(iz).map(([i, n, c]) => `<tr><td>${esc(i)}</td><td class="n">${n}</td><td class="n">${f2(c)}</td><td class="n">${f2(n * c)}</td></tr>`).join('')}
    <tr><td>${t('material')}</td><td></td><td></td><td class="n">${f2(iz.materialPrik)}</td></tr>
    <tr><td>${t('nabavaDolgo')}</td><td></td><td></td><td class="n">${f0(iz.nabava)}</td></tr>
    <tr class="vs"><td>${t('opremaSkupaj')}</td><td></td><td></td><td class="n">${f0(iz.opremaSk)}</td></tr>
    <tr><td>${t('deloDolgo')}</td><td class="n">${m2(iz.ure)} h</td><td class="n">${f2(URNA)}</td><td class="n">${f0(iz.delo)}</td></tr>
    <tr><td>${t('elektroDolgo')}</td><td class="n">${iz.moduli}</td><td class="n">${f2(ELEKTRO_MODUL)}</td><td class="n">${f0(iz.elektro)}</td></tr>
  </tbody></table>
  <div class="skupaj"><div class="v"><span>${t('opremaZNabavo')}</span>${f0(iz.opremaSk)}<br><span>${t('delo')}</span>${f0(iz.delo)}<br><span>${t('elektro')}</span>${f0(iz.elektro)}<br><span>${t('skupajBrez')}</span>${f0(iz.brez)}<br><span>${t('ddvStopnja')}</span>${f2(iz.ddv)}</div>
    <div><b>${f2(iz.z)}</b><small>${t('skupajZMalo')}</small></div></div>
  <h2>${t('pogoji')}</h2>
  <ul>
    ${t('pogojiSez', fDatum(veljavnost)).map(p => `<li>${p}</li>`).join('\n    ')}
  </ul>
  <div class="pod"><div><b>${t('ponudnik')}</b>Matej Moharič, MM projekti, s.p.</div><div><b>${t('potrditev')}</b>${t('datumPodpis')}</div></div>`;
}
document.getElementById('g-pdf').addEventListener('click', () => {
  sestaviPonudbo();
  sporocilo(t('shraniPdf'));
  setTimeout(() => window.print(), 300);
});
window.__ponudba = sestaviPonudbo;   // za samodejni preizkus

posodobiJezik();
velikost();
osvezi();
</script>
</body>
</html>
