<title>Konfigurator pametnega doma | MM projekti</title>
<meta name="description" content="Sestavite pametni dom za svoje stanovanje ali hišo: izberite tloris, naprave po prostorih in takoj vidite ceno z DDV.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --pine:#1E4634; --pine-2:#2C5A45; --ink:#1C2420; --soft:#5F6B64; --rule:#DCE3DE; --tint:#EEF3EF;
    --clay:#B4612E; --paper:#FFFFFF; --bg:#F3F5F3;
    --sans:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --serif:'Source Serif 4', Georgia, serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font:15px/1.45 var(--sans); color:var(--ink); background:var(--bg); }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--clay); outline-offset:2px; }

  .app { display:grid; grid-template-columns:1fr 400px; height:100vh; }
  #pogled { position:relative; min-width:0; }
  #pogled canvas { display:block; width:100%; height:100%; }
  .namig { position:absolute; left:16px; bottom:14px; font-size:13px; color:var(--soft); background:rgba(255,255,255,.8); padding:4px 10px; border-radius:6px; }
  .znak { position:absolute; left:16px; top:14px; display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--pine); font-weight:600; background:rgba(255,255,255,.85); padding:6px 12px 6px 6px; border-radius:10px; }
  .znak svg { width:30px; height:30px; }
  .etaze { position:absolute; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:4px; background:rgba(255,255,255,.92); padding:4px; border-radius:10px; box-shadow:0 1px 3px rgba(20,32,26,.08); }
  .etaze[hidden] { display:none; }
  .etaze button { border:0; background:none; padding:6px 12px; border-radius:7px; color:var(--soft); font-weight:500; font-size:13.5px; white-space:nowrap; }
  .etaze button[aria-pressed="true"] { background:var(--pine); color:#fff; }

  .panel { background:var(--paper); border-left:1px solid var(--rule); display:flex; flex-direction:column; min-height:0; }
  .panel header { padding:18px 20px 0; }
  .panel h1 { font-size:21px; line-height:1.15; margin:0 0 4px; color:var(--pine); font-weight:600; letter-spacing:-.01em; }
  .panel header p { margin:0 0 14px; color:var(--soft); font-size:13.5px; }
  nav.zavihki { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--rule); padding:0 12px; }
  nav.zavihki button { border:0; background:none; padding:10px 4px 11px; color:var(--soft); font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; }
  nav.zavihki button[aria-selected="true"] { color:var(--pine); border-bottom-color:var(--pine); font-weight:600; }
  .vsebina { flex:1; overflow:auto; padding:16px 20px 24px; }
  .vsebina h2 { font-size:15px; margin:18px 0 8px; color:var(--pine); font-weight:600; }
  .vsebina h2:first-child { margin-top:0; }
  .opis { color:var(--soft); font-size:13.5px; margin:0 0 10px; }

  .predloge { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .predloge button { text-align:left; border:1px solid var(--rule); background:var(--paper); border-radius:10px; padding:10px 12px; }
  .predloge button b { display:block; font-weight:600; }
  .predloge button span { font-size:12.5px; color:var(--soft); }
  .predloge button[aria-pressed="true"] { border-color:var(--pine); background:var(--tint); }

  .soba { border-top:1px solid var(--rule); padding:10px 0; }
  .soba.izbrana { background:linear-gradient(90deg, var(--tint), transparent); margin:0 -20px; padding:10px 20px; }
  .soba .vrsta1 { display:grid; grid-template-columns:1fr 128px 30px; gap:8px; align-items:center; }
  .soba input[type=text], .soba select, .mere input { border:1px solid var(--rule); border-radius:7px; padding:6px 8px; background:#fff; width:100%; }
  .mere { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:7px; }
  .mere label { font-size:11.5px; color:var(--soft); }
  .mere input { padding:4px 6px; }
  .brisi { border:0; background:none; color:var(--soft); font-size:18px; line-height:1; padding:4px; border-radius:6px; }
  .brisi:hover { color:var(--clay); background:#F7EDE6; }
  .etazni { display:grid; gap:6px; }
  .etazna { display:flex; justify-content:space-between; align-items:center; border:1px solid var(--rule); border-radius:9px; padding:8px 12px; font-size:13.5px; color:var(--soft); }
  .etazna b { color:var(--ink); font-weight:600; margin-right:6px; }
  .brisi-etazo { border:0; background:none; color:var(--clay); font-weight:500; font-size:13px; padding:2px 4px; }
  .etaza-naslov { font-size:13px; color:var(--soft); font-weight:600; margin:14px 0 2px; }
  .etaza-izbira { display:flex; align-items:center; gap:8px; margin-top:7px; font-size:12px; color:var(--soft); }
  .etaza-izbira select { border:1px solid var(--rule); border-radius:7px; padding:4px 6px; background:#fff; }
  .dodaj { margin-top:8px; width:100%; border:1px dashed var(--pine-2); color:var(--pine); background:none; border-radius:8px; padding:9px; font-weight:500; }
  .povrsina { font-size:12.5px; color:var(--soft); margin-top:10px; }
  .opozorilo { color:var(--clay); font-size:12.5px; margin-top:4px; }

  .skupina { border-top:1px solid var(--rule); padding:10px 0 4px; }
  .skupina h3 { font-size:14px; margin:0 0 6px; font-weight:600; display:flex; justify-content:space-between; }
  .skupina h3 span { font-weight:400; color:var(--soft); font-size:12.5px; }
  .naprava { display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; padding:4px 0; }
  .naprava svg { width:20px; height:20px; }
  .naprava .ime { font-size:13.5px; }
  .naprava .ime small { display:block; color:var(--soft); font-size:11.5px; }
  .stevec { display:flex; align-items:center; border:1px solid var(--rule); border-radius:8px; overflow:hidden; }
  .stevec button { border:0; background:#fff; width:30px; height:28px; color:var(--pine); font-size:17px; }
  .stevec button:hover { background:var(--tint); }
  .stevec output { min-width:26px; text-align:center; font-variant-numeric:tabular-nums; font-weight:600; }

  table.cene { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.cene td { padding:5px 0; border-bottom:1px solid var(--rule); vertical-align:top; }
  table.cene td.n { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; padding-left:8px; }
  table.cene tr.vsota td { font-weight:600; color:var(--pine); border-bottom:none; padding-top:8px; }
  table.cene small { color:var(--soft); }

  .noga { border-top:1px solid var(--rule); padding:14px 20px 16px; background:var(--paper); }
  .noga .zneski { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .noga .zneski b { font-size:26px; color:var(--pine); font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .noga .zneski span { color:var(--soft); font-size:13px; text-align:right; }
  .gumbi { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .gumbi button { border-radius:9px; padding:10px; font-weight:600; border:1px solid var(--pine); }
  .gumbi .glavni { background:var(--pine); color:#fff; }
  .gumbi .drugi { background:#fff; color:var(--pine); }
  .sporocilo { font-size:12.5px; color:var(--pine-2); min-height:18px; margin-top:6px; }

  .kratko { display:none; }
  @media (max-width: 860px) {
    .etaze { top:auto; bottom:8px; }
    .etaze button { padding:5px 9px; font-size:12.5px; }
    .app { grid-template-columns:1fr; grid-template-rows:minmax(190px, 34svh) minmax(0, 1fr); height:100dvh; }
    .panel { border-left:0; border-top:1px solid var(--rule); min-height:0; }
    .panel header { padding:10px 16px 0; }
    .panel h1 { font-size:17px; margin:0 0 2px; }
    .panel header p { display:none; }
    nav.zavihki button { padding:8px 4px 9px; font-size:14px; }
    .vsebina { padding:12px 16px 16px; }
    .namig { display:none; }
    .znak { top:8px; left:8px; padding:4px 10px 4px 4px; font-size:14px; }
    .znak svg { width:24px; height:24px; }
    .noga { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:center; padding:8px 16px calc(8px + env(safe-area-inset-bottom)); }
    .noga .zneski { display:block; margin:0; }
    .noga .zneski b { display:block; font-size:21px; line-height:1.1; }
    .noga .zneski span { display:block; text-align:left; font-size:11.5px; line-height:1.3; }
    .gumbi { gap:6px; }
    .gumbi button { padding:9px 6px; font-size:14px; }
    .dolgo { display:none; }
    .kratko { display:inline; }
    .sporocilo { grid-column:1 / -1; min-height:0; margin-top:0; }
    .sporocilo:empty { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }

  /* ---------- ponudba za tisk ---------- */
  #ponudba { display:none; }
  @media print {
    @page { size:A4; margin:14mm 15mm 15mm; }
    html, body { height:auto; background:#fff; }
    .app { display:none !important; }
    #ponudba { display:block; font:9.6pt/1.5 var(--serif); color:var(--ink); }
    #ponudba * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  #ponudba .gl { display:flex; justify-content:space-between; align-items:center; font-family:var(--sans); font-size:8.5pt; color:var(--soft); border-bottom:1px solid var(--rule); padding-bottom:3mm; }
  #ponudba .gl .zn { display:flex; gap:2.4mm; align-items:center; color:var(--pine); font-weight:600; font-size:11pt; }
  #ponudba .gl svg { width:8mm; height:8mm; }
  #ponudba h1 { font-family:var(--sans); font-size:24pt; color:var(--pine); margin:7mm 0 1mm; font-weight:600; letter-spacing:-.02em; line-height:1.05; }
  #ponudba .podnaslov { color:var(--soft); margin:0 0 5mm; }
  #ponudba .meta { display:grid; grid-template-columns:repeat(4,1fr); gap:4mm; font-family:var(--sans); font-size:8.3pt; margin-bottom:5mm; }
  #ponudba .meta span { display:block; color:var(--soft); }
  #ponudba .meta b { font-weight:600; font-size:9.5pt; }
  #ponudba .meta .crta { border-bottom:1px solid var(--ink); height:5mm; }
  #ponudba img.slika { display:block; max-width:100%; max-height:92mm; margin:0 auto; }
  #ponudba h2 { font-family:var(--sans); font-size:12.5pt; color:var(--pine); margin:5mm 0 2mm; font-weight:600; page-break-after:avoid; break-after:avoid; }
  #ponudba table { width:100%; border-collapse:collapse; font-family:var(--sans); font-size:8.8pt; page-break-inside:auto; }
  #ponudba th { text-align:left; font-weight:600; color:var(--pine); border-bottom:1.4px solid var(--pine); padding:1.3mm 0; }
  #ponudba td { padding:.8mm 0; border-bottom:1px solid var(--rule); }
  #ponudba td.n, #ponudba th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:3mm; }
  #ponudba tr.vs td { font-weight:600; color:var(--pine); border-bottom:none; }
  #ponudba tr { page-break-inside:avoid; }
  #ponudba .skupaj { margin-top:4mm; display:grid; grid-template-columns:1fr auto; align-items:end; background:var(--pine); color:#fff; border-radius:2mm; padding:4.5mm 6mm; font-family:var(--sans); page-break-inside:avoid; }
  #ponudba .skupaj .v { font-size:8.8pt; line-height:1.75; opacity:.9; }
  #ponudba .skupaj .v span { display:inline-block; min-width:50mm; }
  #ponudba .skupaj b { font-size:21pt; font-weight:600; }
  #ponudba .skupaj small { display:block; text-align:right; font-size:8pt; opacity:.8; }
  #ponudba ul { padding-left:4.5mm; margin:2mm 0; }
  #ponudba li { margin-bottom:.5mm; }
  #ponudba .pod { display:grid; grid-template-columns:1fr 1fr; gap:14mm; margin-top:8mm; font-family:var(--sans); font-size:8.5pt; color:var(--soft); page-break-inside:avoid; }
  #ponudba .pod div { border-top:1px solid var(--ink); padding-top:2mm; }
  #ponudba .pod b { display:block; color:var(--ink); }
  #ponudba .prelom { page-break-before:always; }
</style>

    const r = novaSoba('spalnica', x1, z0, 3.5, 3.5, 'Nov prostor', e); st.sobe.push(r); izbrana = r.id; st.predloga = null; osvezi(); return;
  }
  const k = t.dataset.plus || t.dataset.minus; if (!k) return;
  const d = t.dataset.plus ? 1 : -1, [a, b] = k.split(':');
  if (a === 'g') st.skupno[b] = Math.max(0, Math.min(10, st.skupno[b] + d));
  else { const r = st.sobe.find(x => x.id === +a); r.n[b] = Math.max(0, Math.min(20, r.n[b] + d)); }
  osvezi();
});
vs.addEventListener('change', e => {
  const el = e.target, s = el.closest('[data-soba]'); if (!s || !el.dataset.polje) return;
  const r = st.sobe.find(x => x.id === +s.dataset.soba), p = el.dataset.polje;
  if (p === 'ime') r.ime = el.value.slice(0, 40) || TIPI[r.tip].ime;
  else if (p === 'e') { r.e = Math.max(0, Math.min(MAX_ETAZ - 1, +el.value | 0)); }
  else if (p === 'tip') { const staro = TIPI[r.tip].ime, stariTip = r.tip; r.tip = el.value; r.n = { ...TIPI[r.tip].def }; if (r.ime.startsWith(staro) || r.ime === 'Nov prostor') r.ime = TIPI[r.tip].ime;
    const ods = pocistiSkupne(stariTip); if (ods.length) sporocilo(`Odstranjeno, ker ni več prostora vrste ${staro.toLowerCase()}: ${ods.join(', ')}.`); }
  else { let v = parseFloat(String(el.value).replace(',', '.')); if (!isFinite(v)) return;
    v = Math.round(v * 100) / 100; if (p === 'w' || p === 'd') v = Math.max(1, Math.min(40, v)); else v = Math.max(-50, Math.min(50, v)); r[p] = v; }
  st.predloga = null; izbrana = r.id; osvezi();
});
vs.addEventListener('focusin', e => { const s = e.target.closest('[data-soba]'); if (s && +s.dataset.soba !== izbrana) { izbrana = +s.dataset.soba; zgradi(); } });

const LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="13" fill="#1E4634"/><path d="M15 47V19l17 16 17-16v28" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="35" r="3" fill="#C2703B"/></svg>';
function obrezi(cv) {          // izreže prazno ozadje okoli parcele
  const w = cv.width, h = cv.height, c = document.createElement('canvas'); c.width = w; c.height = h;
  const k = c.getContext('2d'); k.drawImage(cv, 0, 0);
  const px = k.getImageData(0, 0, w, h).data, bg = [px[0], px[1], px[2]];
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
    const i = (y * w + x) * 4;
    if (Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2]) > 12) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 <= x0) return cv.toDataURL('image/jpeg', .9);
  const m = Math.round(Math.min(w, h) * .02); x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w, x1 + m); y1 = Math.min(h, y1 + m);
  const o = document.createElement('canvas'); o.width = x1 - x0; o.height = y1 - y0;
  const ok = o.getContext('2d'); ok.fillStyle = '#fff'; ok.fillRect(0, 0, o.width, o.height);
  ok.drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  // ozadje v belo, da se zlije s papirjem
  const d = ok.getImageData(0, 0, o.width, o.height), q = d.data;
  for (let i = 0; i < q.length; i += 4) if (Math.abs(q[i] - bg[0]) + Math.abs(q[i + 1] - bg[1]) + Math.abs(q[i + 2] - bg[2]) <= 6) { q[i] = q[i + 1] = q[i + 2] = 255; }
  ok.putImageData(d, 0, 0);
  return o.toDataURL('image/jpeg', .92);
}
